<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="makuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0c13"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#ff6b81"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ffa502"/>
    </linearGradient>
  </defs>

  <!-- Background Dark Rounded Square -->
  <rect width="400" height="400" rx="60" fill="url(#makuGrad)" stroke="rgba(255,215,0,0.25)" stroke-width="6"/>

  <!-- Japanese Red Sun (Hinomaru) -->
  <circle cx="200" cy="155" r="75" fill="url(#sunGrad)" opacity="0.95"/>

  <!-- Sushi Roll Art Icon -->
  <g transform="translate(200, 155)">
    <!-- Outer Seaweed / Nori -->
    <ellipse cx="0" cy="0" rx="60" ry="42" fill="#1e272e" stroke="#2f3542" stroke-width="4"/>
    <!-- Rice layer -->
    <ellipse cx="0" cy="0" rx="50" ry="34" fill="#f1f2f6"/>
    <!-- Salmon core -->
    <ellipse cx="-12" cy="-4" rx="16" ry="12" fill="#ff4757"/>
    <!-- Avocado core -->
    <ellipse cx="15" cy="-2" rx="14" ry="10" fill="#2ed573"/>
    <!-- Cucumber / Crab core -->
    <ellipse cx="2" cy="12" rx="12" ry="8" fill="#ffa502"/>
    <circle cx="0" cy="-4" r="3" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Crossed Chopsticks Art -->
  <path d="M 120 70 L 280 230" stroke="#ffd700" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 280 70 L 120 230" stroke="#ffd700" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- Japanese Kanji for "MAKU" / "幕" -->
  <text x="200" y="275" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">
    MAKU SUSHI
  </text>

  <!-- Subtitle Japanese & City -->
  <text x="200" y="315" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#e056fd" text-anchor="middle" letter-spacing="6">
    幕 • SUSHI &amp; FUSIÓN • LOJA
  </text>

  <!-- Decorative Border Dots -->
  <circle cx="90" cy="311" r="3" fill="#ffd700"/>
  <circle cx="310" cy="311" r="3" fill="#ffd700"/>
</svg>
